<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 热点集成站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>AI 热点集成站</h1>
      <p>一站式查看大模型、AI 工具、行业动态与学习资源。</p>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="搜索热点关键词（如：GPT-5、AI Agent、多模态）" />
      </div>
    </header>

    <main>
      <section class="toolbar">
        <button class="chip active" data-category="all">全部</button>
        <button class="chip" data-category="model">模型更新</button>
        <button class="chip" data-category="tool">工具发布</button>
        <button class="chip" data-category="industry">行业应用</button>
        <button class="chip" data-category="learn">学习资源</button>
      </section>

      <section class="grid" id="cards"></section>
    </main>

    <footer>
      <p>数据来源：示例静态数据（可替换为 API 聚合）。</p>
    </footer>

    <template id="cardTemplate">
      <article class="card">
        <div class="meta">
          <span class="tag"></span>
          <time></time>
        </div>
        <h2></h2>
        <p></p>
        <a class="link" target="_blank" rel="noreferrer noopener">查看详情</a>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
